<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="img/png" href="assets/ChainChompIcon.png">
    <title>Chain Chomp Jump</title>
</head>

<body>

    <audio id="background-music" src="assets/BGmusic.mp3" loop></audio>

    <div class="game-layout">

        <div class="theatre">
            <div class="game-board">
                <img src="assets/ChainChomp.webp" class="chain-chomp jump">
                <img src="assets/spike.png" class="spike">
            </div>
        </div>

        <div class="instructions">
            <img src="assets/Up Arrow White.png" alt="Up Arrow">
            <img class="yoshi" src="assets/YoshiJump.png" alt="Yoshi">
            <img src="assets/Space White.png" alt="Space">
        </div>

    </div>

    </div>

    <div class="modal-overlay" id="start-modal">
        <div class="modal">
            <h1>
                <img src="assets/Start Game.png" alt="Start Game">
            </h1>
            <button id="start-button">
                <img src="assets/StartG.png" alt="Start">
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="game-over-modal" hidden>
        <div class="modal">
            <h1>
                <img src="assets/Game Over.png" alt="Game Over">
            </h1>
            <button id="restart-button">
                <img src="assets/Restart.png" alt="Restart">
            </button>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
