<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="img/png" href="assets/ChainChompIcon.png">
    <title>Chain Chomp Jump</title>
</head>

<body>

    <audio id="background-music" src="assets/BGmusic.mp3" loop></audio>

    <div class="theatre">

        <div class="game-board">

            <img src="assets/ChainChomp.webp" class="chain-chomp jump">
            <img src="assets/pipe.png" class="pipe">

        </div>
    </div>
</body>

    <!-- Modal inicial -->
    <div class="modal-overlay" id="start-modal">
        <div class="modal">
            <h1>Chain Chomp Jump</h1>
            <p>Press "Start" to begin and "Space" or "↑" to Jump!</p>
            <button id="start-button">Start</button>
        </div>
    </div>

    <!-- Modal de Game Over -->
    <div class="modal-overlay" id="game-over-modal" hidden>
        <div class="modal">
            <h1>Game Over!</h1>
            <p>Try again.</p>
            <button id="restart-button">Restart</button>
        </div>
    </div>


<script src="script.js"></script>
</html>
